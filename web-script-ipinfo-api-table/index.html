<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>IP API</h1>
        
        <div class="search-section">
            <input 
                type="text" 
                id="ipInput" 
                class="ip-input" 
                placeholder="1.1.1.1"
                aria-label="Campo para inserir endereço IP"
            >
            <button id="searchBtn" class="search-btn">Pesquisar</button>
        </div>

        <table class="ip-table">
            <thead>
                <tr>
                    <th>IP</th>
                    <th>Org</th>
                    <th>Country</th>
                    <th>City</th>
                    <th>Clear</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Linhas da tabela serão adicionadas aqui via JavaScript -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
